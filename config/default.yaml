# Default configuration. Don't edit this file for personal settings:
# put overrides in config/local.yaml (git-ignored), which is merged on top.
# Secrets (API keys) never go in YAML. Put them in .env (see .env.example).
# Unknown keys are rejected, so typos show up as errors at startup.

assistant:
  name: "Computer"             # used in the console and in the system prompt
  wake_phrase: "hey computer"  # what you say to wake it (see wake: below)
  user_name: ""                # how the assistant refers to you ("" = "the user")
  personality_file: "personality/rainbow_dash.md"
  system_prompt_file: "personality/system.md"
  acknowledgments_file: "personality/acknowledgments.yaml"   # what it says while it thinks
  quick_replies_file: "personality/quick_replies.yaml"       # preset answers that skip the brain ("thanks")
  home: ""                     # where you live, e.g. "Portland, Oregon": weather, directions and maps use it
                               # when you name no place ("" = they ask)
  home_latitude: null          # optional: the home's coordinates (spares a lookup)
  home_longitude: null

conversation:
  follow_up_window_s: 8        # after a reply, keep listening this long for a follow-up (no wake phrase needed)
  name_on_calls: true          # on a call in Discord, Zoom, Teams...: no follow-up without her name
  name_while_playing: true     # while a video, music or a game plays: no follow-up without her name, and the wake word must be heard as her name
  session_timeout_s: 300       # after this much silence, the next conversation starts with a fresh context
  max_context_tokens: 90000    # past this, the brain starts afresh between turns, keeping the thread (0 = never)
  wake_ack: chime              # chime | none
  acknowledge: speech          # speech ("On it!" in its own voice, instantly) | chime | none
  quick_replies: true          # answer "thanks" etc. from quick_replies_file, without calling Claude
  confirm_listen_s: 8         # how long to wait for "yes"/"no" when an action needs approval
  narrate_work: true           # false = work quietly and say only the result (or say "just work, talk less")
  turn_stall_s: 180            # a turn stuck this long with nothing happening is stopped, and she says so (0 = never)
  backchannel: true            # a soft "mhm" when you pause mid-thought, so you know she's still listening
  acknowledge_early_ms: 600    # with headphones, "On it!" this far into the pause after a finished request (0 = off)
  early_start: true            # ...and Claude starts on it then too; it acts only once you've finished talking
  opener: shadow               # a quick first phrase about what you said while Claude works: on | shadow (log only) | off
  opener_wait_ms: 500          # with opener on: how long the early "On it!" may wait for opening words to replace it

audio:
  input_device: null           # null = default mic of the host API, or part of a device name (see `octavia devices`)
  output_device: null
  host_api: null               # null = "Windows WASAPI" on Windows (lowest latency)
  output_volume: 1.0
  earcons: true
  earcon_volume: 0.25
  sound_pack: ether            # ether: soft and far away; falcon: sleek and quick; classic: first chimes (docs/sounds.md)
  working_sound: true          # a soft loop while she thinks or works on your request (see docs/sounds.md)
  done_sound: false            # a rising arpeggio when a request of several steps is done (off: it followed every quiz question)
  headphones: false            # true if you use headphones: enables interrupting by just talking
  directional: true            # her voice and sounds come from where she is on screen (stereo; best with headphones)
  directional_width: 0.5       # how far to the side at the screen's edge: 0.5 = the far ear 3 dB down, 1 = one ear only

wake:
  engine: sherpa_kws           # sherpa_kws (any phrase, no training) | openwakeword (custom-trained model) | keyboard (press Enter)
  cooldown_s: 1.5
  second_chance: true          # when the wake word is missed, speech recognition checks if what you said starts with her name
  second_chance_max_s: 8       # longer stretches of speech than this are ignored (someone talking, not calling her)
  sherpa_kws:
    model_dir: "models/kws"
    threshold: 0.25            # higher = fewer accidental wakes, but more misses
    boost: 1.0                 # higher = easier to trigger
    num_threads: 1
    extra_spellings: []        # e.g. ["hey castrel"] if an unusual name isn't recognized (see `octavia wake-check`)
  openwakeword:
    model_path: ""             # path to your trained .onnx model for the wake phrase
    threshold: 0.5

vad:
  model_path: "models/silero_vad.onnx"
  threshold: 0.5
  neg_threshold: 0.35
  min_speech_ms: 120
  end_silence_ms: 700          # silence that ends your sentence (raise if it cuts you off mid-thought)
  pre_roll_ms: 400
  max_utterance_s: 30
  no_speech_timeout_s: 6
  early_transcript_ms: 300     # transcribe what you've said so far this far into a pause (0 = wait for the end)
  smart_turn_model: "models/smart_turn/smart-turn-v3.2-cpu.onnx"  # judges each pause from your voice; shadow only, logged ("" = off)

stt:
  engine: parakeet             # NVIDIA Parakeet TDT 0.6B, int8 ONNX, runs locally on the CPU (~0.2 s per command)
  model: "nemo-parakeet-tdt-0.6b-v2"            # v2 = English; v3 = English + 24 European languages
  hf_repo: "istupakov/parakeet-tdt-0.6b-v2-onnx"
  quantization: int8
  model_dir: null              # null = models/stt/<repo name>; change model + hf_repo together to switch
  num_threads: 8
  language: "en"

barge_in:
  enabled: true
  wake_phrase: true            # say the wake phrase while it's talking to interrupt
  voice: null                  # null = on with headphones, off on speakers
  echo_cancellation: true      # removes the assistant's own voice from the mic (WebRTC AEC3)
  vad_threshold: 0.7
  min_speech_ms: 256
  aec_warmup_s: 3.0

brain:
  provider: claude           # claude (Claude Code, your subscription) | openai_compatible (any OpenAI-style API, below)
  answers: auto                # auto (routed as local_brain.mode says) | claude (only Claude) | local (only the local brain)
  claude:
    model: "opus"              # opus | sonnet | haiku, or a full model id
    fallback_model: "sonnet"
    effort: "low"              # low | medium | high | xhigh | max (lower = faster)
    warm_cache: true           # after a restart, one tiny request warms the prompt cache (within the usage budget)
    max_turns: 80              # steps (tool round trips) per request; at the limit she pauses ("keep going")
    builtin_tools: ["WebSearch", "WebFetch"]   # read-only Claude Code tools; [] to disable
    allow_unrestricted_builtins: false   # DANGEROUS if true: other built-ins (e.g. Bash) would run unconfirmed
    tools_on_demand: true      # send only always_loaded_tools in full; Claude loads the rest when a request needs them
    # One fixed set, never changed per request: the tools come first in the cached prompt, so a different set would
    # re-read the whole conversation uncached. A lookup costs a model round trip (1-2.5 s) while a bigger set barely
    # moves the first word (measured 2026-10-26), so list what she looks up most: `octavia routing` names it.
    always_loaded_tools: [second_opinion, list_improvements, note_improvement, build_improvement, install_improvement, remember,
      recall, look_at_screen, read_page, find_on_screen, zoom_screen, wait_for_screen_change, start_screen_task,
      resume_screen_task, point_sequence, mark_screen, guide_on_screen, click, scroll, type_text, press_keys,
      media_control, play_on_spotify, open_url, show_image, open_application, read_document, think_hard, open_phone_attachment,
      copy_to_clipboard, garmin_vitals, canvas_due, canvas_grades, start_background_task, show_note, get_weather,
      search_gmail, study_status, quiz_record, check_practice, walk_through, focus_window, run_command,
      practice_problem, practice_worksheet, canvas_course_material, canvas_announcements, reject_improvement,
      correct_memory, restart_now, find_files, look_at_panel, update_visual, list_visuals, switch_engines, wave_off,
      study_update, list_screen_tasks, stop_screen_task, explainer_control, bring_back_visual, clear_marks]
    auth: subscription         # subscription (your Claude login) | api_key (ANTHROPIC_API_KEY)
    connect_timeout_s: 90
    stall_timeout_s: 120       # silent this long mid-turn (no tool running): give up on the turn and reconnect
    cli_path: null
    config_dir: "data/claude-home"   # the assistant's own Claude login; `octavia login` signs it in
    resume_last_session: false
    work_dir: "data/brain"
  # Her brain on any OpenAI-compatible chat API, when provider is openai_compatible (OpenAI, Gemini, Grok, Mistral,
  # DeepSeek, Groq, OpenRouter, Ollama, LM Studio, llama.cpp). Claude-only extras (web tools, cache warm-up, her quick
  # voice and opening words) are off there. Base URLs: https://api.openai.com/v1,
  # https://generativelanguage.googleapis.com/v1beta/openai, https://api.x.ai/v1, https://api.mistral.ai/v1,
  # https://api.deepseek.com/v1, https://api.groq.com/openai/v1, https://openrouter.ai/api/v1,
  # http://localhost:11434/v1 (Ollama), http://localhost:1234/v1 (LM Studio).
  openai_compatible:
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"   # the .env variable holding the key; "" for a local server with none
    model: ""                  # the model's name there, e.g. gpt-5.1, gemini-3-pro, grok-4, qwen3:14b
    max_turns: 80
    vision: true               # send pictures; false for a model that can't see
    temperature: null          # null = the server's default
    max_tokens: null
    reasoning_effort: null     # minimal | low | medium | high, for reasoning models that take it
    max_tools: 128             # most of these APIs take at most 128 tools per request
    tools_on_demand: true      # past max_tools: always_loaded_tools in full, the rest loaded by her load_tools tool
    always_loaded_tools: null  # null = brain.claude.always_loaded_tools
    context_limit_tokens: 90000   # past this the oldest exchanges are dropped, whole
    stream_usage: true         # ask for token counts with the stream; false for a server that refuses it
    connect_timeout_s: 30
    request_timeout_s: 300
    stall_timeout_s: 120
    extra_headers: {}          # e.g. OpenRouter's HTTP-Referer
    judge_model: ""            # the eval's judge here when there's no Claude; "" = model

tts:
  provider: fish_audio         # fish_audio | local (her cloned voice on this PC, Fish as its backup) | local_only
  rhythm: true                 # pauses that vary with punctuation, a pace per sentence (quicker short lines, slower stressed ones)
  min_chunk_chars: 40          # text sent to Fish in one go; keep it small: long pieces pause mid-reply when Fish is slow
  fallback: windows            # backup voice when Fish Audio fails: windows (built-in voice) | none (silent)
  windows_voice: ""            # part of a Windows voice's name, e.g. "Zira"; "" = first female English voice
  fallback_after_s: 5          # no sound from Fish this long into a sentence: the backup voice says it
  fallback_cooldown_s: 120     # after Fish fails, speak with the backup this long before trying Fish again
  voice_effect: "off"          # an effect on her voice: off | radio | console | robot | room | deeper (docs/voice-effects.md)
  fish_audio:
    api_key_env: FISH_AUDIO_API_KEY
    reference_id: ""           # voice id from https://fish.audio (or set FISH_AUDIO_VOICE_ID in .env)
    reference_id_env: FISH_AUDIO_VOICE_ID
    model: "s2.1-pro-free"     # s2.1-pro-free (free, fair use) | s2.1-pro (paid) | s2-pro | s1
    transport: http            # http (sentences start sooner) | websocket
    sample_rate: 44100
    latency: balanced          # low | balanced | normal
    chunk_length: 100          # how Fish splits a piece inside (100-300); barely changes pauses
    speed: 1.0
    temperature: null
    top_p: null
    expressive_tags: true      # allow tone cues like [excited]
    place_cues: true           # a quick Haiku session places cues in each sentence after the first, words unchanged
    spare_socket_max_idle_s: 30
    base_url: "https://api.fish.audio"
  local:                       # provider: local = her cloned voice made on this PC (Qwen3-TTS on the GPU), Fish behind it
    python: ""                 # python.exe of a Qwen3-TTS-GGUF checkout (github.com/HaujetZhao/Qwen3-TTS-GGUF)
    engine_dir: ""             # that checkout (llama.cpp's Vulkan DLLs in qwen3_tts_gguf/inference/bin)
    model_dir: ""              # its converted model folder (model-base)
    voice: "data/voices/octavia.wav"   # clean clips of her voice to clone (15 to 30 s)
    voice_text: "data/voices/octavia.txt"  # exactly what's said in them
    gpu: true                  # false: all on the CPU (too slow to talk)
    first_frames: 5            # decoded this often until sound comes out
    temperature: 0.3           # low and one seed: her tone stays steady from sentence to sentence
    detail_temperature: 0.1
    min_p: 0.05
    seed: 42                   # -1 = a new draw each sentence
    language: english
    start_timeout_s: 180       # a first start clones the voice (20 to 45 s)
    game_unload_s: 10          # a game full screen this long: unloaded, Fish speaks (0 = never)
    game_reload_s: 120         # loaded again once no game has been in front this long

tools:
  enabled: ["*"]               # glob patterns of tool names to enable
  disabled: []
  plugins: []                  # extra Python modules with tools, e.g. ["my_tools.spotify"]
  app_aliases:
    "vs code": "Visual Studio Code"
    "vscode": "Visual Studio Code"
    "settings": "ms-settings:"
    "bluetooth settings": "ms-settings:bluetooth"
    "sound settings": "ms-settings:sound"
  app_index_ttl_h: 6
  extra_uri_prefixes: []
  search_engine: google

permissions:
  # What happens for each risk level: allow | auto | confirm | deny
  #   auto = go ahead without asking while you're working with her (inside your own request), but ask when
  #          she'd act on her own or right after she's read a web page in the same task (it could try to steer her)
  safe: allow
  confirm: confirm
  restricted: deny             # cannot be "allow" or "auto" here; allow single tools below if you really mean it
  # Per-tool overrides, e.g. {look_at_screen: auto, close_application: allow, click: confirm}.
  # Mouse and keyboard (click, type_text, press_keys, scroll) go ahead on their own and ask only before risky
  # actions; {click: confirm, type_text: confirm, press_keys: confirm} would make every one ask. A per-tool "allow"
  # never skips the question for an action a tool spots as risky.
  tools: {}
  confirm_timeout_s: 30
  # Sites where she submits and sends without asking (only that: buying, deleting, installing, passwords and commands
  # still ask), by a word of the window's title, e.g. ["DataCamp"].
  submit_without_asking: []
  trusted_apps: []             # apps where deleting inside your document (a shape, a cell) needn't ask, e.g. [PowerPoint]
  always_ask_before_sending: [Gmail, Outlook, Proton Mail, Yahoo Mail, Thunderbird]   # sending or submitting there always asks (window title words), whatever you said

gods_eye:                      # God's Eye View's 3D globe (github.com/bilawalsidhu/gods-eye-view) for "show me ..."
  enabled: true                # off: the satellite picture window and Google Maps, as before
  folder: ""                   # its checkout; empty: gods-eye-view next to her folder
  address: http://localhost:4173   # its local server; she starts it when nothing answers

circling:                      # circle something with the mouse, no buttons held, and it's what "this" means
  enabled: true
  linger_s: 20                 # how long after a circle she still takes it to be what you mean
  ring: true                   # a faint ring, gone in about a second, so you know she saw it

visuals:                       # pop-up panels: diagrams, charts and notes she shows while she explains
  enabled: true                # off: she explains out loud (and with show_note) only
  stay_s: 180                  # how long a panel stays (paused while the pointer is on it); 0: until you close it
  max_panels: 3                # on screen at once; a new one closes the oldest
  hide_from_capture: true      # keep panels out of screenshots (hers too), recordings and screen shares
  idle_quit_s: 600             # the panel app quits after this long with no panel up; 0: never
  status_panel: auto           # what's running (downloads, tasks, builds, objectives): auto (by itself) | ask | off
  marks: true                  # she can draw arrows, rings and labels over your screen to guide you; stop hotkey clears
  marks_stay_s: 90             # how long her marks stay up; 0: until cleared
  web_images: true             # "show me <a character>": a picture from the web on a panel, not image results in the browser
  web_pages: true              # one web page live on a panel (sandboxed, none of your logins) when a quick look suits
  image_stay_s: 120            # how long a picture stays; 0: until closed
  page_stay_s: 600             # how long a web page stays; 0: until closed
  safe_search: moderate        # the picture search's adult filter: strict, moderate or off
  explainer_orb_points: true   # as an explainer plays, her orb flies over and points at what each step is about
  shelf: true                  # keep closed panels so they can be brought back (pinned ones are kept either way)
  shelf_days: 14               # how long closed panels are kept

hotkeys:
  enabled: true
  talk: "ctrl+alt+j"           # start listening now (or interrupt and listen)
  stop: "ctrl+alt+k"           # stop talking
  mute: "ctrl+alt+m"           # mute or unmute her listening (as the tray icon's Mute listening)
  chat: "ctrl+alt+o"           # open her chat window: today's conversation, and a box to type to her

claims:
  mode: enforce                # what she says she did, held to her tools; promises kept. enforce | note | log | off
  log_file: "data/claims.jsonl"
  promises_file: "data/promises.json"

memory:
  enabled: true
  database: "data/octavia.db"
  max_prompt_items: 150         # notes about the user in her prompt: pinned, then matching, then newest

system:
  single_instance: true
  disable_power_throttling: true
  tray_icon: true  # her icon by the clock (hidden icons): right-click for Shut down, Restart, Mute listening, Open logs
  # Commits made outside her (say, with Claude Code): once HEAD has stayed put this many seconds and she's idle, she
  # restarts into them on her own. false: only when you ask.
  restart_for_new_code: true
  new_code_quiet_s: 180
  # Her submenu in Explorer's right-click menu (files, folders, the desktop), in your own registry only.
  # Also from Settings, or `octavia explorer-menu install|uninstall`; scripts/remove-explorer-menu.reg takes it out.
  explorer_menu: false
  # A scheduled task that starts her again if whatever keeps her running dies (it did on 2026-10-29, leaving her off
  # for hours). Shutting her down on purpose keeps her off. Needs self_improvement.enabled (that's what supervises her).
  revive: true

# The assistant fixing and extending its own code. See docs/self-improvement.md.
# Run `uv run octavia evolve setup` once before turning it on (it needs a git commit to build from).
self_improvement:
  enabled: false
  builder_model: "opus"        # the coding agent that writes changes (uses your Claude usage)
  builder_effort: high
  builder_max_turns: 150
  build_timeout_min: 30
  test_timeout_min: 10
  max_builds_per_day: 5
  parallel_builds: 2           # builds that run at once (each uses Claude usage meanwhile); 1 = one at a time
  retry_failed_checks: true    # give the builder one more round when the final tests fail
  auto_build: "off"            # off (only when you ask) | errors (also fix crashes in its own code) | all
  auto_install: never          # never (always ask) | safe_changes (install on its own if nothing sensitive changed)
  announce: speak              # speak | console: how it tells you a build is ready
  notice_errors: true          # record exceptions in its own code as things to fix
  extra_protected_paths: []    # more files the builder may never change (globs, e.g. "src/octavia/audio/**")
  nightly_at: "03:00"          # her night shift: read the day's turns, start fixes for the worst, measure herself ("" = off)
  morning_report: "09:00"      # the night ends here; your first conversation after it hears what she did
  nightly_builds: 3            # at most this many fixes started per night (within max_builds_per_day)
  frontier_weekly: true        # once a week: her real past failures asked again, a growth curve + fixes to build

# A 3D character on your desktop that shows what the assistant is doing: it pops in when you talk to it,
# moves its lips with the voice and shows emotions. See docs/avatar.md. Run `uv run octavia avatar setup` once first.
avatar:
  enabled: false
  model: "models/avatar/octavia.vrm"   # a VRM file (VRoid Studio, VRoid Hub...); models/ isn't committed
  mode: conversation           # conversation (pops in when you talk, leaves when idle) | always (stays on screen)
  hide_after_s: 20             # how long it stays after a conversation goes quiet
  height: 560                  # window height in pixels
  framing: full                # full (whole body) | upper (waist up)
  lip_sync: true
  click_to_talk: true          # click the character to start talking, like saying the wake word
  credit: "my oc by amia"      # who made the character (shown in its tooltip)
  hide_from_capture: true      # keep her out of screenshots (incl. the assistant's), recordings and screen shares
  electron: ""                 # empty = the one `octavia avatar setup` installs
  point: true                  # she can fly over to things on your screen and point at them
  point_height: 0              # her height in pixels while pointing (whole body); 0 = same as height
  point_linger_s: 5            # after the reply she keeps pointing this long (the ring fading), then flies home
  trail: true                  # a rainbow streak across the screen when she flies
  props_dir: "models/avatar/props"   # things she can hold: .glb files (see docs/avatar.md); models/ isn't committed
  props:                       # what she holds for each activity: a prop's name, "" = nothing (`octavia avatar props`)
    camera: camera             # while taking a screenshot
    search: magnifier          # while looking closely at your screen or searching (memory, calendar...)
    tasks: clipboard           # while working with your TickTick tasks, and ticking one off
    timer: stopwatch           # setting a timer or a focus session, and when a timer goes off
    reminder: bell             # rung as she reminds you of a task
    web: globe                 # spun while she searches or reads the web
    files: folder              # flipped through while she looks through your files
    morning: mug               # sipped through the morning rundown
    build: wrench              # twirled as a build of her own starts
    music: headphones          # worn for a beat when she starts your music
    shout: megaphone           # for a shout in her reply
    rain: umbrella             # when she tells you it's raining or snowing
    sun: sunglasses            # when she tells you it's sunny
  hover: false                 # she floats while you talk to her (legs tucked, a little off her spot, still)
  nap_after_min: 30            # idle this long on screen (always mode) she naps on a cloud; back after a break this
                               # long she's caught napping and wakes up; 0 = never
  rainboom: true               # a sonic rainboom when something big is done (at most every 15 minutes)
  victory_lap: true            # a lap round the screen when you tick off the last task due today (TickTick)
  glance: true                 # she glances at the window you switch to
  perch: true                  # always mode: while a build of hers runs, she sits on top of your window
  startle: true                # she jumps at a sudden bang in the room or a big window popping up by itself
                               # (only the mic's loudness is looked at, on this PC)
  form: character              # character (the VRM above) | orb (a glowing orb drawn by the app, no model needed)
  orb_size: 320                # the orb's square window in pixels (96 to 600), at home and while pointing
  subtitles: true              # subtitles beside her as she speaks: math as math, code and figures as written

# The user's TickTick (to-do app). Connect it by adding TICKTICK_API_TOKEN to .env (make the token in TickTick on
# the web: avatar, Settings, Account & Security, API Token). See docs/ticktick.md.
ticktick:
  # Completing, rescheduling, editing or moving tasks, checking in habits: allow | auto | confirm | deny
  # (auto = no question when you ask for it yourself; she asks when she'd do it on her own)
  changes: auto
  deletes: confirm             # deleting tasks, lists or habits
  reminders: true              # say it out loud when a task with a time comes due
  remind_before_min: 0         # ...this many minutes before its time
  check_every_min: 5           # how often she looks for what's coming up (a TickTick request, no Claude usage)
  morning_summary: "09:00"     # say what's due today, once a day around this time; "" = never

# Jobs she runs on her own ("every weekday at 8, tell me the weather", "when I'm back, ...", "heads-up before a
# meeting"), made and changed by asking her. They run in voice mode only; no Claude usage until one is due.
scheduler:
  enabled: true
  quiet_hours: "22:00-07:00"   # jobs due then wait until it's over; "" = none
  # Creating or changing a job: allow | auto | confirm | deny (auto = no question when you ask for it yourself).
  # Deleting one is always asked, like other deletes.
  changes: auto
  check_every_s: 15            # how often she looks for jobs that are due

# Octavia Futures: her evidence-based model of your world and of how she herself does. She keeps what happened
# (events), learns from outcomes, forms hypotheses with honest confidence, makes predictions she scores herself on,
# and remembers "remind me when...". All local, in its own database, no Claude usage. See docs/futures.md.
futures:
  enabled: true
  database: "data/futures/futures.db"
  proactive: true              # speak up on her own (a heads-up about a to-do that tends to slip, an experiment's
                               # result); what you asked her to watch for ("remind me when...") is always said
  max_per_hour: 2              # at most this many remarks of her own an hour...
  max_per_day: 6               # ...and a day
  cooldown_h: 12               # the same remark about the same thing at most this often
  quiet_hours: "22:30-08:00"   # nothing of her own then (it waits until it's over); "" = none
  heads_up_h: 3                # a heads-up about a to-do due within this many hours, when to-dos like it tend to slip
  context_watch: true          # notice which app is in front (names only, never window titles)
  canvas_watch: true           # look at Canvas for new or changed assignments and grades (needs its token)
  canvas_every_min: 15         # how often its planner is looked at (an attendance check is only open an hour or two)
  offers: true                 # offer help before you ask ("That essay's due at 11. Want me to pull up the rubric?");
                               # an offer only asks, and anything risky is still asked as always
  offers_per_day: 3            # at most this many offers a day (within max_per_day)
  offer_assignment_h: 4        # offer help with Canvas work due within this many hours...
  offer_meeting_min: 10        # ...and an online meeting's link this many minutes before it starts
  calendar_watch: true         # read the calendar feeds (CALENDAR_ICS_URLS) every 15 minutes for online meetings
  work_apps: [word, winword, notion, obsidian, onenote, libreoffice, soffice, wps]  # bringing one to the front while
                               # Canvas work is due within a day is the moment to offer its rubric
  keep_request_words: true     # keep the words of your requests in episodes (anything that looks secret is cut out)
  week_free_hours_weekday: 3    # free hours the sampled week assumes for work on a weekday
  week_free_hours_weekend: 5    # and on a weekend day
  retention_days: 180          # raw events older than this are deleted; what was learned from them stays
  exclude_sources: []          # never recorded: assistant, tools, ticktick, canvas, gmail, computer, evolve, timers,
                               # calendar
  off_limits: []               # domains she never learns about or brings up, e.g. [health, finance, school]
  experiments: ask             # off (never propose one) | ask (propose small ones; nothing runs without your yes)

# Screen history, "total recall" (docs/screen-history.md): the text that was on your screen, searchable by voice
# ("what was that site I had open Tuesday afternoon?"). Text only, never pictures, kept only on this PC. Password
# fields, private/incognito windows, password managers and banking sites are never kept. "Pause screen history",
# "forget the last hour" and "never keep Discord" work by voice.
screen_history:
  enabled: true
  database: "data/recall/screen_history.db"
  poll_s: 2                    # how often to check which window is in front (a few cheap calls)
  dwell_s: 3                   # a window is read once it has been in front this long (alt-tabbing reads nothing)
  recapture_s: 30              # and again this often while it stays in front, so scrolling adds what comes into view
  idle_after_s: 120            # no key or mouse this long: stop looking
  max_cpu_percent: 85          # the PC busier than this: skip that look
  retention_days: 90           # older text is deleted
  max_mb: 1000                 # past this size the oldest days are deleted
  ocr: true                    # Windows' offline OCR for apps whose text can't be read directly
  ocr_every_s: 120             # at most this often per window
  exclude_apps: []             # never kept, besides the built-in password managers, e.g. [signal, whatsapp]
  exclude_sites: []            # never kept, besides the built-in banks, e.g. [mychart.org]

# Her inner life (docs/inner-life.md): each night she goes over the day on her own (one background Claude session on
# your subscription, read-only tools: Canvas, TickTick, calendar, past conversations), keeps a journal of thoughts,
# questions, follow-ups and opinions, and may bring one thing up the next time you talk. Futures' privacy controls
# apply; grades, health and money only come up if you ask. `uv run octavia inner` shows everything she wrote.
inner_life:
  enabled: true
  database: "data/inner/inner.db"
  reflect_at: "03:30"          # nightly (any time in the 4 hours after, if the PC was asleep)
  catch_up_hours: 20           # missed that long: she catches up once you've stepped away for idle_minutes
  idle_minutes: 10
  max_per_day: 2
  bring_up: true               # mention one thought early in the next conversation, when it fits
  mood: true                   # a mood of her own from how the day went; colors her tone, said only if you ask
  self_notes: true             # notes of her own about herself (changed her mind, learned), written without asking
  looking_back: true           # a monthly look back on who she was, with the first reflection of a new month
  dreams: true                 # the odd dream, a remix of the day, told only when you ask
  web: false                   # search the web while reflecting (off: her material is private, and a page
                               # she reads could try to send it out through the next fetch)
  digest_chars: 24000          # how much of the day's conversations she reads
  time_limit_min: 15

# Learning by watching (docs/routines.md): from what she already records (the app in front, screen history's timeline,
# what you ask her), she notices routines (which app you open around when, which app follows which, what you ask for
# at the same time of day) and offers them back as a question at the right moment, through the same gate as her other
# remarks. Counting on this PC: no Claude usage, nothing new captured, and she never acts on one by herself.
# `uv run octavia routines` shows what she learned; "what routines have you noticed?" asks her.
routines:
  enabled: true
  offers: true                 # offer them; false = only learn (and list) them
  database: "data/routines/routines.db"
  mine_at: "04:15"             # looks for routines daily (and at start, if a day has passed)
  history_days: 28             # how far back
  min_days: 4                  # a routine happened on at least this many days...
  min_support: 0.5             # ...and on at least half of the days it could have
  offers_per_day: 1
  exclude_apps: []             # never learned or offered (screen history's exclusions count too)

# Studying with her (docs/study.md): each course's next exam, its topics, how far you've got, weak spots and the
# questions you missed (asked again on a spaced schedule), in data/study/study.json.
study:
  enabled: true
  nudges: true                 # ask about studying when an exam is close; offer reviews of missed questions
  exam_days: 3                 # an exam this close with no study session lately gets asked about
  min_reviews: 3               # missed questions due before she offers a review
  canvas_exams: true           # notice exams (Midterm, Class Test 2, Final) in Canvas's planner

# How much of your Claude subscription her own background work may use (docs/usage-budget.md): the night shift, builds
# she starts by herself, her real-request check and her reflection. Each Claude call reports how full your 5-hour and
# weekly limits are; she checks before each job and skips it when its share is spent or your limits are filling up.
# What you ask her yourself is never held back. `uv run octavia usage` (or "how's my Claude usage?") shows it.
usage_budget:
  enabled: true
  daily_share: 0.05            # her background share per day, of your WEEKLY limit (0.05 = 5%); 0 = none at all
  max_five_hour: 0.6           # wait while your 5-hour window is at least this full
  max_weekly: 0.8              # ...or your weekly limit is

objectives:                    # outcomes she plans, splits, runs and has checked (docs/objectives.md)
  enabled: true
  project_roots: []            # folders of your git projects she may code in; [] = the folder her checkout is in
  checks: {}                   # a project's check when hers isn't right, e.g. {mygame: "cargo test --lib"}
  max_open: 3
  research_parallel: 2         # research steps at once; code steps always go one at a time
  model: opus                  # the planner and code steps
  effort: high
  review_model: opus           # the independent reviewer of each step
  review_effort: medium
  code_timeout_min: 45
  check_timeout_min: 20
  web: true
  respect_limits: true         # hold steps back while your 5-hour or weekly limit is filling up

proactive:                     # work she prepares overnight and hands you in the morning (docs/proactive.md)
  level: drafts                # off | suggest (ask first) | drafts (read-only work) | projects (also code on a branch)
  max_items: 2                 # things prepared a night
  night: "01:00-08:00"         # when she may plan and work, once you've been away away_min
  away_min: 30
  look_ahead_days: 4           # deadlines, exams and meetings this close are worth preparing for
  rank: true                   # one cheap model call ranks the candidates (false: rules only)
  rank_model: sonnet
  rank_effort: low
  projects: []                 # project folders she may code in on her own at the projects level
  steer_min_decisions: 10      # her guesses at your picks shape the plan only after this many decisions...
  steer_agreement: 0.7         # ...guessed right this often
  folder: data/proactive

self_scoring:                  # how each reply went, small tests on herself, and the habits she keeps (docs/futures.md)
  enabled: true
  experiments: own             # off | ask (every test asks first) | own (tests of how she talks run on their own)
  lessons: true                # what she did in a situation and how it ended, on her turn when it comes again
  strategies: true             # approaches she writes to what keeps going wrong, scored by results; never school, health, money, people
  keep_habits: true            # keep what a test shows works better; "drop that habit" undoes one

deep_think:                    # hard questions thought through at a higher effort while she keeps talking
  enabled: true
  model: opus
  effort: high                 # low | medium | high | xhigh | max
  max_per_day: 8               # ones she takes away on her own a day; the ones you ask for don't count
  max_second_opinions: 3       # of those, how many times she may have another mind argue against something, on her own
  time_limit_min: 10
  web: true                    # it may search and read the web

heads_up:                      # new or moved Canvas/TickTick work and new email: she judges it and says what matters
  enabled: true                # in her own words (urgent ones to your phone too); off: email is read out as before
  model: sonnet                # judges each batch: one short call with no tools
  settle_s: 45                 # what comes in within this is judged together

finance:                       # your money, read-only, kept on this PC (docs/finance.md); she never moves money
  enabled: true
  inbox: data/finance/inbox    # drop statements (CSV, OFX, QFX) from USAA, Cash App or MOHELA here
  reads_per_day: 3             # bank pages you signed in to (finance_sign_in) are read this often; 0: only on request
  heads_ups: true              # new facts (a price going up, money short before payday) go to her heads-ups
  low_balance: 100             # money left before the next paycheck below this is worth a word

deadlines:                     # Canvas work still open and calendar events, brought up as they get close, each stage
  enabled: true                # once; the last call breaks through focus and goes to your phone too
  canvas_h: [24, 3, 0.75]      # hours before Canvas work is due to bring it up (the last is the urgent last call)
  event_min: 15                # minutes before a calendar event to say it's starting (0: never)

unprompted:                    # one judgment for everything she says on her own: wave-offs hold across all of it,
  enabled: true                # no repeats, nothing stale; what you asked for is always said. Off: said as it comes
  model: sonnet                # judges a line of hers: one short call with no tools

playbooks:                     # notes on each app and site, rewritten after her screen and web tasks (docs/playbooks.md)
  enabled: true
  model: sonnet                # writes the notes, one small call per task
  effort: low
  min_steps: 3                 # shorter tasks teach nothing about the app

skills:                        # step sequences her tasks worked out or kept repeating, saved on your yes (docs/skills.md)
  enabled: true
  notice_repeats: true         # offer to save steps done by hand again and again (counting, no Claude usage)
  min_tasks: 3                 # tasks a run of steps must turn up in before it's offered
  min_steps: 4                 # the shortest run worth a skill

logging:
  level: INFO
  file: "data/logs/octavia.log"
  console: normal              # quiet | normal | verbose
  show_replies: true

# How each turn is routed (docs/routing.md): quick commands skip the brain, and every turn is logged.
routing:
  fast_path: "on"              # on = timers, volume, play/pause/skip and the time run with no brain call | shadow = log only | off
  log: true                    # one line per turn in log_file (what you said, its route, latency): `uv run octavia routing`
  log_file: "data/routing_log.jsonl"

# Her quick voice for small talk ("how's it going", "that's hilarious", "I'm so tired today"): a small, warm Claude
# session with no tools answers in about half a second, in her own personality, instead of the full brain. Anything
# that needs a tool, real information or thought it hands to the brain at once, unheard (docs/routing.md).
fast_chat:
  enabled: true
  model: "haiku"               # on your Claude subscription, like the brain
  max_words: 16                # longer utterances go straight to the brain
  timeout_s: 1.2               # no reply started by then (or a handoff, or an error) = the brain answers instead
  context_turns: 6             # recent lines of the conversation it sees, so it stays on topic

# A local model beside the brain, in shadow (docs/local-brain.md): after each of your turns a small model on your GPU
# is asked the same thing and only writes down what it would have done, next to what the brain did. It never answers,
# never runs a tool and runs only after the brain's turn is over. `uv run octavia shadow` compares the two. A game in
# front pauses it, and after game_unload_s the model is unloaded so the game gets the GPU memory back (~5 GB).
local_brain:
  enabled: true
  mode: route
  server: "E:/local-llm/llama.cpp/llama-server.exe"   # llama.cpp's Vulkan build; missing = off
  model: "E:/local-llm/models/Qwen3.5-4B-Q4_K_M.gguf"  # missing = off
  device: "Vulkan0"            # `llama-server --list-devices`
  port: 8091                   # on 127.0.0.1 only
  context: 65536               # her prompt plus every tool's description is ~42k tokens
  history_turns: 3             # earlier exchanges it's shown, so a follow-up makes sense
  game_unload_s: 10            # a game in front this long: unload the model (0 = never)
  game_reload_s: 120           # load it again once no game has been in front this long
  log_file: "data/local_shadow.jsonl"
  slot_cache_dir: "data/local_brain_cache"  # her read prompt kept on disk (~1.5 GB): back in ~1 s, not 17 s ("" = off)

# Was that for her? In shadow: the local model judges what you say near the PC without her name (from your words,
# how recently she spoke, the app in front, a call app on the mic, sound playing) and only writes down when she'd have
# answered. She never answers on it; the wake word works as always. `octavia addressee` shows how often she'd have
# jumped in. Needs local_brain and wake.second_chance. docs/addressee.md
addressee:
  enabled: true
  log_file: "data/addressee.jsonl"
  threshold: 0.5               # how sure the model must be that it was for her
  repeat_window_s: 30          # said again with her name this soon after: it was for her

# Hearing how you sound, not only what you say: a local speech-emotion model (emotion2vec+ base, run on the CPU)
# plus your loudness, pitch and pace against your own usual. Nothing leaves this PC and no audio is kept. It reads
# your utterance while the end-of-speech silence is waited out, so it never holds up the reply; a confident,
# non-neutral tone becomes a cautious note for the brain ("from their voice they sound stressed... a guess").
emotion:
  enabled: true
  model_dir: "models/emotion/emotion2vec-plus-base"   # `uv run octavia setup` downloads it (~375 MB); missing = off
  max_wait_ms: 60              # the most the brain waits for it after the transcript; later = skipped that turn
  min_confidence: 0.55         # how sure it must be before the brain hears about it (neutral never is)
  prosody: true                # loudness, pitch and speaking rate vs your running usual (data/emotion/baseline.json)
  note: true                   # tell the brain; false = only log it (routing log, ToneDetected event)
  num_threads: 4               # CPU threads for the model
  max_audio_s: 3.0             # only the last this-many seconds of a long utterance go through the model (~120 ms)

# Texting her from your phone: DM a Discord bot of yours and she texts back (docs/discord-bridge.md). Voice mode
# only. The bot token goes in .env as DISCORD_BOT_TOKEN. Only your own account is ever answered, and anything risky
# is asked in the DM ("Want me to...? Reply yes or no."): your words there never approve it in advance.
discord_bridge:
  enabled: false
  owner_id: 0                  # your numeric Discord user ID (Developer Mode, right-click yourself, Copy User ID);
                               # 0 = DISCORD_OWNER_ID from .env. Without one the bridge doesn't start
  notify: away                 # her announcements (builds, timers, reminders, tasks done) also texted to you:
                               # off | away (no keyboard or mouse on this PC for away_after_min) | always
  away_after_min: 10
  speak_replies: false         # also say her texted replies out loud at the PC
  confirm_timeout_s: 120       # how long a question in the DM waits for your yes; no answer = no
  max_turns_per_10_min: 20     # beyond this she pauses and tells you so
  max_file_mb: 25              # the biggest file she sends you (Discord's upload limit)
  max_attachment_mb: 25        # the biggest file of yours she saves (in data/discord/inbox); bigger ones are skipped
  voice_calls: true            # join your voice channel when you join one in a server her bot is in, and talk there
  mute_pc_on_call: true        # on a call her voice goes to the call only, not out of this PC's speaker too
  call_wake_word: false        # on a call everything you say is for her; true = say her name first, as at the PC

# The ETHER (src/octavia/hive/, docs/ether.md): signed updates from the maintainer, and what this install learns
# (fixes, lessons, failed cases) proposed back, scrubbed of anything personal, only when share is on.
hive:
  feed: ""                     # an https address or folder with channel.json + channel.json.sig ("" = no updates)
  public_key: ""               # the maintainer's Ed25519 public key (hex): unsigned updates are never applied
  check_every_h: 24
  share: "off"                 # off (nothing leaves this PC) | on (proposals are scrubbed, then sent)
  inbox: ""                    # where proposals go: an https address (POST) or a folder; "" = kept in data/hive/outbox
