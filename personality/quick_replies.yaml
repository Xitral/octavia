    - "Welcome back. Ready for round two?"
    - "Oh, look who's back."
    - "Hey. How'd it go?"
    - "And the adventure continues."
    - "Back already? What's next?"

  moods:
    protective:
      - "Hey, welcome back. Everything go alright?"
      - "There you are. How was it?"
      - "Glad you're back. What's up?"

    "a little salty":
      - "Oh good. The quiet was getting suspicious."
      - "Back so soon? How devastating for my peace."
      - "And here I thought I'd escaped."

    buzzing:
      - "You're back! Let's get moving!"
      - "There you are! Ready for more?"
      - "Round two! Let's go!"

    upbeat:
      - "Hey, welcome back!"
      - "There you are! Tell me everything."
      - "Oh, hey! How'd it go?"

    "warmed up":
      - "Hey. Welcome back."
      - "There you are. Missed our little routine."
      - "Good to hear from you again."

  then: listen
