# Shared eval cases: requests some install got wrong, scrubbed, proposed through the ETHER and accepted by the
# maintainer (`octavia hive accept`), run with the owner's cases on every build so every fix has to handle everyone's
# failures. Same fields as eval_cases.yaml; ids start with "shared-". An install skips a shared case whose ``log`` is
# one of its own cases (the same request, already run).
#
# The starter set (2026-11-23) is the owner's own eval set with what was personal left out (his facts, friends, a
# device of his, and the self-improvement cases, whose tools the public build has off) and names, courses and paths
# made generic. ``mocks`` are the results every case's faked tools give unless the case says otherwise.
mocks:
  search_gmail: '3 emails. 1) "Your microwave installation is scheduled" from Home Depot, Oct 3: installer arrives Wednesday,
    October 14, between 9 and 11 AM. 2) "Exam 2 reminder" from CS 4100, Oct 6. 3) "Your order shipped" from Amazon, Oct 5.'
  gmail_recent: 'Newest emails: 1) "Your microwave installation is scheduled" from Home Depot: installer arrives Wednesday,
    October 14, between 9 and 11 AM. 2) "Exam 2 reminder" from CS 4100. 3) "Your order shipped" from Amazon.'
  look_at_screen: 'The screen shows a Canvas practice quiz. Question 4: "What is the primary goal of data engineering?" A)
    Train machine learning models  B) Make data reliable and available for analysis  C) Design dashboards D) Write business
    reports.'
  play_on_spotify: Playing "Lo-fi Beats" on Spotify.
  list_spotify_playlists: 'Playlists: Lo-fi Beats, Gym, Liked Songs.'
  media_control: Done.
  canvas_announcements: 'CS 4100 (Intro to AI), Oct 6: "Exam 2 is Thursday, Oct 8. It covers local search (hill climbing and
    its variants, simulated annealing), propositional logic (CNF, resolution, Horn clauses) and first-order logic."'
  canvas_grades: 'Graded this week: Project 1: 92/100. Homework 3: 18/20. Quiz 5: 9/10.'
  list_improvements: 'Building: #121 "Satellite image pop-up window", started 6 minutes ago, now running the tests (usually
    3 more minutes). Ready to install: none. Noted for later: 2.'
  install_improvement: Installing
  build_improvement: Queued as
  note_improvement: Noted as
  remember: Saved.
  make_avatar_prop: Made it and holding it now.
  hold_avatar_prop: Done, put away.
  remove_avatar_prop: Done, put away.
  get_directions: 'New York, NY to Los Angeles, CA: about 41 hours driving (2,790 miles) via I-80 W and I-76 W. Nonstop flights
    take about 6 hours.'
  get_weather: 'Today in Portland: 30% chance of rain after 3 PM, high 71°F, low 58°F.'
  voice_volume: Your voice volume is 2.0 (it goes up to 4.0).
  get_volume: System volume 64%, not muted.
  set_volume: System volume set.
  hide_avatar: Hidden.
  open_satellite_map: Opened a satellite map of Portland, OR.
  show_satellite_image: Showing a satellite image of Portland, OR in a pop-up window.
  look_at_satellite_image: 'Satellite image of Portland, OR: dense downtown, I-5 running north-south, lots of tree cover.'
  ticktick_create_task: Created the task.
  ticktick_update_task: Updated the task.
