[project]
name = "octavia"
version = "0.2.4"
description = "A local, voice-first personal desktop assistant for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "numpy>=2.5.3",
    "claude-agent-sdk==0.2.159",
    "mcp>=2,<3",
    "onnxruntime>=1.20",
    "sounddevice>=0.5",
    "websockets>=15",
    "ormsgpack>=1.5",
    "httpx>=0.27",
    "psutil>=6",
    "rapidfuzz>=3",
    "pywin32>=311 ; sys_platform == 'win32'",
    "winrt-windows-media-control>=3.2 ; sys_platform == 'win32'",
    "winrt-runtime>=3.2 ; sys_platform == 'win32'",
    "pycaw>=20250000 ; sys_platform == 'win32'",
    "livekit>=1.1.18",
    "sherpa-onnx==1.13.8",
    "sentencepiece>=0.2",
    "onnx-asr>=0.12",
    "huggingface-hub>=0.30",
    "sherpa-onnx-core==1.13.8",
    "winrt-windows-foundation>=3.2 ; sys_platform == 'win32'",
    # Screen history's offline OCR (Windows.Media.Ocr), for apps whose text UI Automation can't read.
    "winrt-windows-media-ocr>=3.2 ; sys_platform == 'win32'",
    "winrt-windows-graphics-imaging>=3.2 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=3.2 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=3.2 ; sys_platform == 'win32'",
    "mido>=1.3",
    "music21>=9.1",
    "discord-py[voice]>=2.7.1",
    # Screenshots go to the model as JPEG (screen_capture.encode_image).
    "pillow>=12",
]

[project.scripts]
octavia = "octavia.cli:main"

[project.gui-scripts]
# Windowless launcher used by autostart (.venv\Scripts\octaviaw.exe)
octaviaw = "octavia.cli:main_background"

[project.optional-dependencies]
openwakeword = [
    "openwakeword>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octavia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B027: interface hooks are intentionally optional no-ops. UP042/UP047: keep (str, Enum) and TypeVar styles.
ignore = ["E501", "B027", "UP042", "UP047"]

[tool.uv]
# This assistant targets Windows; don't try to resolve Linux-only wheels (e.g. tflite-runtime).
environments = ["sys_platform == 'win32'"]
