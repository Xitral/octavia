<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Octavia</title>
    <link rel="stylesheet" href="panel.css" />
    <link rel="stylesheet" href="film.css" />
    <script type="module" src="panel.js"></script>
  </head>
  <body>
    <div id="panel" class="panel" hidden>
      <span class="twinkle t1"></span><span class="twinkle t2"></span><span class="twinkle t3"></span>
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <header id="bar" class="bar">
        <span class="glyph">✦</span>
        <h1 id="title"></h1>
        <button id="clear" class="tool" title="Wipe the ink">⌫</button>
        <button id="pen" class="tool" title="Write on it">✎</button>
        <button id="pin" class="tool" title="Pin: keep it up, even after a restart" aria-pressed="false">&#xe718;</button>
        <button id="close" class="close" title="Close (or right-click anywhere)">✕</button>
      </header>
      <main id="content" class="content"></main>
      <footer class="timer"><i id="timer"></i></footer>
      <span class="grip" data-edge="r"></span><span class="grip" data-edge="l"></span><span class="grip" data-edge="b"></span>
      <span class="grip" data-edge="br"></span><span class="grip" data-edge="bl"></span>
    </div>
  </body>
</html>
