<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Octavia subtitles</title>
    <link rel="stylesheet" href="subtitles.css" />
    <script type="module" src="subtitles.js"></script>
  </head>
  <body>
    <div id="stage" class="stage">
      <div id="clip" class="clip">
        <div class="haze"><div id="haze" class="drift"></div></div>
        <div id="view" class="view"><div id="lines" class="lines"></div></div>
        <div id="measure" class="measure" aria-hidden="true"></div>
      </div>
      <svg class="wire" aria-hidden="true">
        <line id="connector" class="connector" x1="0" y1="0" x2="0" y2="0" />
      </svg>
      <div id="glow" class="glow">
        <div id="underline" class="underline"><span class="lit"></span></div>
        <span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span>
        <span class="dust"></span><span class="dust"></span><span class="dust"></span><span class="dust"></span><span class="dust"></span>
      </div>
    </div>
  </body>
</html>
